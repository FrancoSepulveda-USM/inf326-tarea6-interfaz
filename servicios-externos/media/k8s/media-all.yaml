# 1. Almacenamiento persistente para MongoDB de Media
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-mongodb-data
  namespace: grupo-archivos-adjuntos
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# 2. Base de datos MongoDB propia de Media
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-mongodb
  namespace: grupo-archivos-adjuntos
  labels:
    app: media-mongodb
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: media-mongodb
  template:
    metadata:
      labels:
        app: media-mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7
          args:
            - mongod
            - --bind_ip_all
            - --wiredTigerCacheSizeGB
            - "0.25"
          ports:
            - containerPort: 27017
              name: mongodb
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 250m
              memory: 384Mi
          volumeMounts:
            - name: data
              mountPath: /data/db
          livenessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: media-mongodb-data
---
apiVersion: v1
kind: Service
metadata:
  name: media-mongodb
  namespace: grupo-archivos-adjuntos
  labels:
    app: media-mongodb
spec:
  type: ClusterIP
  ports:
    - port: 27017
      targetPort: 27017
      name: mongodb
  selector:
    app: media-mongodb
---
# 3. RabbitMQ para eventos y workers de previews
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: grupo-archivos-adjuntos
  labels:
    app: rabbitmq
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-alpine
          ports:
            - containerPort: 5672
              name: amqp
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: "chat"
            - name: RABBITMQ_DEFAULT_PASS
              value: "chat"
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 250m
              memory: 384Mi
          livenessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 2
          readinessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 25
            periodSeconds: 10
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: grupo-archivos-adjuntos
  labels:
    app: rabbitmq
spec:
  type: ClusterIP
  ports:
    - port: 5672
      targetPort: 5672
      name: amqp
    - port: 15672
      targetPort: 15672
      name: management
  selector:
    app: rabbitmq
---
# 4. Microservicio Media (con probes y volumen efímero)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media
  namespace: grupo-archivos-adjuntos
  labels:
    app: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: media
  template:
    metadata:
      labels:
        app: media
    spec:
      containers:
        - name: media
          image: ghcr.io/667r/microservicios/media:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: MONGODB_URL
              value: "mongodb://media-mongodb:27017"
            - name: RABBITMQ_URL
              value: "amqp://chat:chat@rabbitmq:5672/%2F"
            - name: USERS_URL
              value: "http://users.servicios-base.svc.cluster.local:8000"
            - name: CHANNELS_URL
              value: "http://channels.servicios-base.svc.cluster.local:8000"
            - name: MEDIA_STORAGE
              value: "/media-storage"
            - name: MAX_FILE_BYTES
              value: "10485760"
            - name: CHANNEL_QUOTA_BYTES
              value: "104857600"
            - name: CHANNEL_MAX_FILES
              value: "1000"
            - name: PREVIEW_CACHE_SECONDS
              value: "86400"
            - name: PREVIEW_MAX_ATTEMPTS
              value: "3"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: storage
              mountPath: /media-storage
      volumes:
        - name: storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: media
  namespace: grupo-archivos-adjuntos
  labels:
    app: media
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: media
---
# 5. HorizontalPodAutoscaler (Autoscaling)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: media-hpa
  namespace: grupo-archivos-adjuntos
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: media
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
---
# 6. Ingress público con traefik y nip.io
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: media-ingress
  namespace: grupo-archivos-adjuntos
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: media.134.199.176.3.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: media
                port:
                  number: 8000
