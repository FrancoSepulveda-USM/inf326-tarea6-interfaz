apiVersion: apps/v1
kind: Deployment
metadata:
  name: profiles
  namespace: grupo-perfiles
  labels:
    app: profiles
spec:
  replicas: 1
  selector:
    matchLabels:
      app: profiles
  template:
    metadata:
      labels:
        app: profiles
    spec:
      containers:
      - name: profiles
        image: ghcr.io/baldwinzaid/profiles:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: USERS_URL
          value: "http://users.servicios-base:8000"
        - name: CHANNELS_URL
          value: "http://channels.servicios-base:8000"
        - name: MESSAGES_URL
          value: "http://messages.servicios-base:8000"
        - name: MONGODB_URL
          value: "mongodb://profiles-mongodb:27017"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: profiles-mongodb
  namespace: grupo-perfiles
spec:
  replicas: 1
  selector:
    matchLabels:
      app: profiles-mongodb
  template:
    metadata:
      labels:
        app: profiles-mongodb
    spec:
      containers:
      - name: mongo
        image: mongo:7
        ports:
        - containerPort: 27017