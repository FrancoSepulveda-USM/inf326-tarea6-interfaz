apiVersion: v1
kind: Service
metadata:
  name: profiles-svc
  namespace: grupo-perfiles
spec:
  type: ClusterIP
  selector:
    app: profiles
  ports:
  - port: 80
    targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: profiles-mongodb
  namespace: grupo-perfiles
spec:
  type: ClusterIP
  selector:
    app: profiles-mongodb
  ports:
  - port: 27017
    targetPort: 27017