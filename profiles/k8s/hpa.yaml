apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: profiles-hpa
  namespace: grupo-perfiles
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: profiles
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50